<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VXR-MD Enterprise | Pairing</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --text: #1e293b; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; border: 1px solid #e2e8f0; }
        h1 { color: var(--primary); font-size: 1.5rem; margin-bottom: 10px; }
        input { width: 100%; padding: 12px; margin: 20px 0; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; }
        button { background: var(--primary); color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; }
        #code-display { margin-top: 30px; padding: 15px; background: #f1f5f9; border-radius: 8px; font-size: 1.8rem; font-family: monospace; font-weight: bold; letter-spacing: 5px; border: 1px dashed #cbd5e1; }
    </style>
</head>
<body>
    <div class="container">
        <h1>VXR-MD Enterprise</h1>
        <p>Secure Node Pairing System</p>
        <input type="text" id="phone" placeholder="27612345678">
        <button onclick="getPair()">GENERATE SECURE CODE</button>
        <div id="code-display">---- ----</div>
    </div>
    <script>
        async function getPair() {
            const num = document.getElementById('phone').value;
            const display = document.getElementById('code-display');
            if(!num) return alert("Number required");
            display.innerText = "LINKING...";
            try {
                const res = await fetch(`/pair?number=${num}`);
                const data = await res.json();
                display.innerText = data.code || "FAILED";
            } catch { display.innerText = "ERROR"; }
        }
    </script>
</body>
</html>
